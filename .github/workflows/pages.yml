# Build, test and deploy Slippery Fish to GitHub Pages.
#
# - Pull requests and pushes run the checks (typecheck, unit tests, content
#   validation, production build, browser smoke tests against the build).
# - Only pushes to `main` (or a manual run) deploy.
# - One-time setup: repository Settings → Pages → Build and deployment →
#   Source: "GitHub Actions".
#
# The build is fully static. No secrets are used: anything passed to Vite as a
# VITE_* variable is bundled into public JavaScript.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production deployment half-way; superseded PR runs may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        # Fails until Settings → Pages → Source is set to "GitHub Actions";
        # checks still run, and the deploy job reports the real problem.
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Resolve base path
        # "/<repo>" for a project site, "" for a user site / custom domain.
        # PRs (and runs where Pages is not configured yet) use the project-site
        # path so sub-path bugs surface in CI.
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$PAGES_OUTCOME" = "success" ]; then base="$PAGES_BASE"; else base="/$REPO_NAME"; fi
          if [ "$PAGES_OUTCOME" = "failure" ]; then
            echo "::warning title=GitHub Pages not configured::Set Settings → Pages → Source to 'GitHub Actions' to enable deployment. Checks still ran."
            echo "### GitHub Pages is not configured — deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "E2E_BASE_PATH=${base%/}/" >> "$GITHUB_ENV"
          echo "Base path: '${base}'"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (validates content first)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (production build, served from its base path)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
